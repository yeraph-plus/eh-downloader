[project]
name = "eh-downloader"
version = "1.2.1"
description = "Queue and cache official E-Hentai archive downloads"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx[socks]>=0.28.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
