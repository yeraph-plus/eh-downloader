name: eh-downloader

x-eh-downloader: &eh-downloader
  image: ${EH_DOWNLOADER_IMAGE:-ghcr.io/yeraph-plus/eh-downloader:latest}
  pull_policy: always
  restart: "on-failure:5"
  environment:
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    SECURE_COOKIES: ${SECURE_COOKIES:-false}
    DATABASE_URL: sqlite:////app/data/eh-downloader.db
    CACHE_DIR: /app/cache
    FRONTEND_DIR: /app/frontend
    DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-7}
    DEFAULT_CACHE_LIMIT_BYTES: ${DEFAULT_CACHE_LIMIT_BYTES:-21474836480}
    DEFAULT_MAX_ARCHIVE_SIZE_MB: ${DEFAULT_MAX_ARCHIVE_SIZE_MB:-4096}
    DEFAULT_WORKER_CONCURRENCY: ${DEFAULT_WORKER_CONCURRENCY:-2}
    EH_PROXY_URL: ${EH_PROXY_URL:-}
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - ./data:/app/data
    - ./cache:/app/cache

services:
  web:
    <<: *eh-downloader
    command: [ "uvicorn", "app.main:app", "--app-dir", "/app/backend", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*" ]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000/tcp"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *eh-downloader
    command: [ "python", "-m", "app.worker_main" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
