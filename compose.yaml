name: eh-downloader

x-eh-downloader: &eh-downloader
  image: ghcr.io/yeraph-plus/eh-downloader:latest
  pull_policy: always
  restart: "on-failure:5"
  environment:
    APP_SECRET: ${APP_SECRET:?}
    ADMIN_USERNAME: ${ADMIN_USERNAME:?}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    SECURE_COOKIES: ${SECURE_COOKIES:?}
    DATABASE_URL: sqlite:////app/data/eh-downloader.db
    DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:?}
    DEFAULT_CACHE_LIMIT_BYTES: ${DEFAULT_CACHE_LIMIT_BYTES:?}
    DEFAULT_MAX_ARCHIVE_SIZE_MB: ${DEFAULT_MAX_ARCHIVE_SIZE_MB:?}
    DEFAULT_WORKER_CONCURRENCY: ${DEFAULT_WORKER_CONCURRENCY:?}
    EH_PROXY_URL: ${EH_PROXY_URL:?}
    CACHE_DIR: /app/cache
    FRONTEND_DIR: /app/frontend
  volumes:
    - ./data:/app/data
    - ./cache:/app/cache

services:
  web:
    <<: *eh-downloader
    command: [ "uvicorn", "app.main:app", "--app-dir", "/app/backend", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*" ]
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_PORT}:8000/tcp"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)" ]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *eh-downloader
    command: [ "python", "-m", "app.worker_main" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
